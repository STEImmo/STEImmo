name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: steimmo
      POSTGRES_USER: steimmo
      POSTGRES_PASSWORD: steimmo-ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      TZ: Europe/Berlin

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: steimmo
          POSTGRES_USER: steimmo
          POSTGRES_PASSWORD: steimmo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steimmo -d steimmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Flüchtigen Django-Testschlüssel erzeugen
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(48) + "\n")
          PY

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Django-Systemcheck
        run: python manage.py check

      - name: Docker-Compose-Konfiguration prüfen
        run: |
          cp docker/.env.example docker/.env
          docker compose --env-file docker/.env -f docker/compose.yaml -f docker/compose.dev.yaml config
          STEIMMO_IMAGE=steimmo-ci STEIMMO_ENV_FILE="$PWD/docker/.env" \
            docker compose --env-file docker/.env -f docker/compose.prod.yaml config --quiet

      - name: Docker-Image bauen
        run: docker build --tag steimmo-ci .

      - name: Produktionscontainer und Persistenz prüfen
        run: bash ops/smoke.sh steimmo-ci

      - name: Demo ohne SMTP und beide Testkonten prüfen
        run: bash ops/smoke.sh steimmo-ci demo

      - name: Migrationen prüfen
        run: python manage.py makemigrations --check --dry-run

      - name: Django-Tests
        run: python manage.py test

      - name: Ruff prüfen
        run: ruff check .

      - name: Ruff-Format prüfen
        run: ruff format --check .

      - name: Deploy-Skripte prüfen
        run: |
          bash -n ops/deploy.sh ops/ship.sh ops/bootstrap-server.sh ops/proxy-source.sh ops/smoke.sh
          python -m unittest discover -s ops/tests -v
