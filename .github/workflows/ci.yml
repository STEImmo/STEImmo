name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: steimmo
      POSTGRES_USER: steimmo
      POSTGRES_PASSWORD: steimmo-ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      TZ: Europe/Berlin

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: steimmo
          POSTGRES_USER: steimmo
          POSTGRES_PASSWORD: steimmo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steimmo -d steimmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Flüchtigen Django-Testschlüssel erzeugen
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(48) + "\n")
          PY

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Django-Systemcheck
        run: python manage.py check

      - name: Django-Deploymentcheck mit isolierten Testwerten
        env:
          DJANGO_SETTINGS_MODULE: config.settings_production
          DJANGO_ALLOWED_HOSTS: steimmo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://steimmo.example.test
          DJANGO_LOGIN_THROTTLE_TRUSTED_PROXY_IPS: 127.0.0.1
          DJANGO_EMAIL_HOST: smtp.example.test
          DJANGO_DEFAULT_FROM_EMAIL: noreply@example.test
          POSTGRES_PASSWORD: ci-only-example-database-password
        run: python manage.py check --deploy --fail-level WARNING

      - name: Docker-Compose-Konfiguration prüfen
        run: |
          cp docker/.env.example docker/.env
          docker compose --env-file docker/.env -f docker/compose.yaml -f docker/compose.dev.yaml config
          STEIMMO_IMAGE=steimmo-ci STEIMMO_ENV_FILE="$PWD/docker/.env" \
            docker compose --env-file docker/.env -f docker/compose.prod.yaml config --quiet

      - name: Docker-Image bauen
        run: docker build --tag steimmo-ci .

      - name: Entwicklungsrechte für einen Linux-Checkout prüfen
        run: |
          docker build --target development --build-arg STEIMMO_DEV_UID=1000 \
            --build-arg STEIMMO_DEV_GID=1000 --tag steimmo-dev-ci .
          bash ops/smoke-development.sh steimmo-dev-ci 1000 1000

      - name: Produktionscontainer und Persistenz prüfen
        run: bash ops/smoke.sh steimmo-ci

      - name: Demo ohne SMTP und beide Testkonten prüfen
        run: bash ops/smoke.sh steimmo-ci demo

      - name: Migrationen prüfen
        run: python manage.py makemigrations --check --dry-run

      - name: Django-Tests
        run: python manage.py test

      - name: Ruff prüfen
        run: ruff check .

      - name: Ruff-Format prüfen
        run: ruff format --check .

      - name: Deploy-Skripte prüfen
        run: |
          bash -n ops/deploy.sh ops/ship.sh ops/bootstrap-server.sh ops/proxy-source.sh ops/smoke.sh ops/smoke-development.sh
          python -m unittest discover -s ops/tests -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mit Historie für Secret-Scan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten für Audit auflösen
        run: |
          python -m venv "$RUNNER_TEMP/audit-target"
          "$RUNNER_TEMP/audit-target/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/audit-target/bin/python" -m pip install ".[dev]"
          "$RUNNER_TEMP/audit-target/bin/python" -m pip list --format=freeze --exclude steimmo > "$RUNNER_TEMP/audit-requirements.txt"
          cat "$RUNNER_TEMP/audit-requirements.txt"

      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip_audit \
            --requirement "$RUNNER_TEMP/audit-requirements.txt" --no-deps --disable-pip \
            --strict --progress-spinner off --desc on

      - name: Git-Historie auf Secrets prüfen
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact=100 --verbose
