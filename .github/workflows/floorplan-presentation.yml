name: Floorplan presentation screenshot
on:
  workflow_dispatch:
  push:
    branches: [docs/floorplan-presentation]
    paths:
      - 'floorplan/steimmo-map-praesentation.html'
      - 'floorplan/presentation-smoke.mjs'
      - '.github/workflows/floorplan-presentation.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke test and 5K screenshot
        run: node floorplan/presentation-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steimmo-floorplan-presentation-5k
          path: floorplan/presentation-output/
          if-no-files-found: warn
