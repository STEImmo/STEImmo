[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steimmo"
version = "0.1.0"
description = "STEImmo – Immobilienverwaltung und Bewerbungsportal"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.13,<0.14",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "wohnungsverwaltung*"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
