<div class="uk-margin" data-signature-pad="{{ role }}">
    <h3 id="signature-label-{{ role }}">{{ label }}: {{ name }}</h3>
    <p class="uk-text-meta" id="signature-help-{{ role }}">Hier mit Finger, Stift oder Maus unterschreiben.</p>
    <canvas width="1200" height="400" class="handover-signature-pad" aria-labelledby="signature-label-{{ role }}" aria-describedby="signature-help-{{ role }}">Ein Browser mit Zeichenflächen-Unterstützung ist erforderlich.</canvas>
    <button type="button" class="uk-button uk-button-default uk-button-small" data-signature-clear>Unterschrift löschen</button>
</div>
