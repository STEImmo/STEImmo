<div data-photo-selection>
    <div class="uk-flex uk-flex-middle uk-flex-wrap uk-grid-small" uk-grid>
        <div uk-form-custom>
            {% if field %}
                {{ field }}
            {% else %}
                <input id="photos-{{ input_id }}" type="file" name="fotos" accept="image/jpeg,image/png,image/webp" multiple required aria-label="Fotos zur Feststellung">
            {% endif %}
            <button class="uk-button uk-button-default" type="button" tabindex="-1"><span uk-icon="icon: camera" aria-hidden="true"></span> Fotos auswählen</button>
        </div>
        <div><button class="uk-button uk-button-text" type="button" data-photo-clear hidden>Auswahl entfernen</button></div>
    </div>
    <p class="uk-text-meta uk-margin-small-top" data-photo-count role="status" aria-live="polite">Mehrere Fotos auswählen oder nacheinander hinzufügen.</p>
    <div class="uk-child-width-1-2@s uk-child-width-1-3@m uk-grid-small" uk-grid data-photo-previews></div>
</div>
