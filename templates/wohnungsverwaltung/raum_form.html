{% extends "base.html" %}

{% block title %}{{ title }} – STE Immobilien eGbR{% endblock %}

{% block content %}
<section class="uk-section uk-section-default">
    <div class="uk-container uk-container-small">
        <a class="uk-button uk-button-text" href="{% url 'verwaltung:wohnung_edit' wohnung.pk %}">Zur Wohnung</a>
        <h1 class="uk-heading-small">{{ title }}</h1>
        <p class="uk-text-meta">{{ wohnung }}</p>
        <form method="post" class="uk-card uk-card-default uk-card-body uk-margin-top">
            {% csrf_token %}
            {% include "wohnungsverwaltung/_form_field.html" with field=form.name %}
            <button class="uk-button uk-button-primary" type="submit">Speichern</button>
        </form>
    </div>
</section>
{% endblock %}
