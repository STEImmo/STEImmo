{% load static %}
<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}STEImmo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/uikit/uikit.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <nav class="uk-navbar-container" uk-navbar>
        <div class="uk-container">
            <div class="uk-navbar-left">
                <a class="uk-navbar-item uk-logo" href="{% url 'home' %}">STEImmo</a>
            </div>
            <div class="uk-navbar-right">
                <a class="uk-navbar-item" href="{% url 'wohnungsverwaltung:handover_protocol_list' %}">Übergaben</a>
            </div>
        </div>
    </nav>

    <main>
        {% if messages %}
            <div class="uk-container uk-margin-top">
                {% for message in messages %}
                    <div class="uk-alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}" uk-alert>
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'vendor/uikit/uikit.min.js' %}"></script>
    <script src="{% static 'vendor/uikit/uikit-icons.min.js' %}"></script>
</body>
</html>
