{% load static %}
<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}STEImmo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/uikit/uikit.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <nav class="uk-navbar-container" uk-navbar>
        <div class="uk-container">
            <div class="uk-navbar-left">
                <a class="uk-navbar-item uk-logo" href="{% url 'home' %}">STEImmo</a>
            </div>
            {% if user.is_staff %}
                <div class="uk-navbar-right">
                    <a class="uk-navbar-item" href="{% url 'wohnungsverwaltung:wohnung_list' %}">
                        Verwaltung
                    </a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main>
        {% if messages %}
            <div class="uk-container uk-margin-top">
                {% for message in messages %}
                    <div class="uk-alert-{{ message.tags|default:'primary' }}" uk-alert>
                        <a class="uk-alert-close" uk-close></a>
                        <p>{{ message }}</p>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'vendor/uikit/uikit.min.js' %}"></script>
    <script src="{% static 'vendor/uikit/uikit-icons.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
