name: steimmo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${STEIMMO_IMAGE:?STEIMMO_IMAGE muss einen geprüften Image-Digest enthalten}
    restart: unless-stopped
    init: true
    env_file:
      - ${STEIMMO_ENV_FILE:?STEIMMO_ENV_FILE fehlt}
    environment:
      DJANGO_SETTINGS_MODULE: ${STEIMMO_SETTINGS_MODULE:-config.settings_production}
      DJANGO_BOOTSTRAP_ON_START: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - media_data:/app/media
    ports:
      - "${STEIMMO_BIND_IP:-127.0.0.1}:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-steimmo-prod-postgres-data}
    external: true
  media_data:
    name: ${MEDIA_VOLUME_NAME:-steimmo-prod-media-data}
    external: true

networks:
  default:
    name: ${STEIMMO_NETWORK_NAME:-steimmo-prod}
    external: true
